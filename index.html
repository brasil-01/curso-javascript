<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curso de JavaScript — do zero ao avançado</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f7df1e'/%3E%3Ctext x='16' y='23' font-family='monospace' font-size='15' font-weight='bold' text-anchor='middle' fill='%230b0f14'%3EJS%3C/text%3E%3C/svg%3E">
<meta name="description" content="Curso interativo de JavaScript em português, com editor de código e testes automáticos.">
<style>
:root{
  --bg:#0b0f14;
  --bg2:#111823;
  --bg3:#17202c;
  --bg4:#1e2936;
  --line:#26313f;
  --line2:#33414f;
  --txt:#e8eef6;
  --mut:#8b9aad;
  --acc:#f7df1e;
  --acc-d:#c9b400;
  --blue:#58a6ff;
  --ok:#3fb950;
  --err:#ff6b6b;
  --warn:#e3b341;
  --kw:#c58bff;
  --str:#7ee787;
  --num:#79c0ff;
  --com:#5f7285;
  --fn:#ffd866;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,"Helvetica Neue",Arial,sans-serif;
  --r:10px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--txt);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;font-size:15px;line-height:1.6;overflow:hidden;
}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:var(--blue)}
::selection{background:rgba(247,223,30,.28)}

/* ---------- layout ---------- */
.app{display:grid;grid-template-rows:56px 1fr;grid-template-columns:288px 1fr;height:100vh;height:100dvh}
.topbar{
  grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 16px;
  background:linear-gradient(180deg,#131b26,#0e141c);border-bottom:1px solid var(--line);z-index:30;
}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.3px;font-size:16px;white-space:nowrap}
.brand .logo{
  width:28px;height:28px;border-radius:7px;background:var(--acc);color:#0b0f14;display:grid;place-items:center;
  font-family:var(--mono);font-weight:800;font-size:12px;letter-spacing:-1px;box-shadow:0 0 0 1px #00000040
}
.brand small{color:var(--mut);font-weight:500;font-size:12px;display:block;line-height:1.1;letter-spacing:0}
.brand .ttl{line-height:1.05}
.topbar .spacer{flex:1}
.progress-mini{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mut);min-width:180px}
.progress-mini .track{height:7px;border-radius:99px;background:var(--bg4);flex:1;overflow:hidden}
.progress-mini .fill{height:100%;width:0;background:linear-gradient(90deg,var(--acc),#8fd14f);transition:width .4s ease;border-radius:99px}
.icon-btn{
  width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--mut);
  border:1px solid transparent;transition:.15s
}
.icon-btn:hover{background:var(--bg3);color:var(--txt);border-color:var(--line)}
.icon-btn.armed{color:var(--err);border-color:rgba(255,107,107,.45);background:rgba(255,107,107,.12)}
.menu-btn{display:none}

/* ---------- sidebar ---------- */
.sidebar{
  background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;
}
.side-head{padding:14px 14px 10px;border-bottom:1px solid var(--line)}
.search{
  width:100%;padding:9px 11px;border-radius:9px;background:var(--bg);border:1px solid var(--line);
  color:var(--txt);font-family:inherit;font-size:13px;outline:none
}
.search:focus{border-color:var(--acc-d);box-shadow:0 0 0 3px rgba(247,223,30,.1)}
.search::placeholder{color:#5d6b7c}
.nav{overflow-y:auto;padding:10px 8px 40px;flex:1;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.nav::-webkit-scrollbar{width:8px}
.nav::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px}
.mod{border-radius:10px;margin-bottom:4px}
.mod-head{
  width:100%;display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;text-align:left;
  color:var(--txt);font-weight:650;font-size:13.5px;transition:.15s
}
.mod-head:hover{background:var(--bg3)}
.mod-head .chev{color:var(--mut);transition:transform .2s;font-size:10px;margin-left:auto}
.mod.open .mod-head .chev{transform:rotate(90deg)}
.mod-head .ico{font-size:14px;width:18px;text-align:center}
.mod-head .cnt{color:var(--mut);font-size:11px;font-weight:500;font-variant-numeric:tabular-nums}
.lessons{display:none;padding:2px 0 6px 0}
.mod.open .lessons{display:block}
.lnk{
  width:100%;display:flex;align-items:flex-start;gap:8px;padding:7px 10px 7px 15px;border-radius:8px;
  color:var(--mut);font-size:13px;text-align:left;line-height:1.35;transition:.12s;position:relative
}
.lnk:hover{background:var(--bg3);color:var(--txt)}
.lnk.active{background:rgba(247,223,30,.1);color:var(--acc);font-weight:600}
.lnk.active:before{content:"";position:absolute;left:5px;top:9px;bottom:9px;width:2px;border-radius:2px;background:var(--acc)}
.lnk .dot{
  width:15px;height:15px;border-radius:50%;border:1.5px solid var(--line2);flex:0 0 auto;margin-top:2px;
  display:grid;place-items:center;font-size:9px;color:#0b0f14
}
.lnk.done .dot{background:var(--ok);border-color:var(--ok);color:#07130a}
.lnk .txt{flex:1}

/* ---------- main ---------- */
.main{display:grid;grid-template-columns:minmax(340px,1fr) minmax(420px,1.05fr);min-height:0;overflow:hidden}
.pane{min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.pane::-webkit-scrollbar{width:10px}
.pane::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px}

/* lesson pane */
.lesson-pane{border-right:1px solid var(--line);padding:26px 30px 60px;max-width:none}
.crumb{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--acc);font-weight:700}
.crumb .sep{color:var(--line2)}
.lesson-pane h1{font-size:26px;line-height:1.22;margin:8px 0 4px;letter-spacing:-.6px;font-weight:800}
.meta{display:flex;gap:14px;align-items:center;color:var(--mut);font-size:12.5px;margin-bottom:16px;flex-wrap:wrap}
.meta .pill{background:var(--bg3);border:1px solid var(--line);padding:2px 8px;border-radius:99px}
.md{font-size:14.6px;color:#cbd6e2}
.md h2{font-size:17px;margin:26px 0 8px;color:#fff;letter-spacing:-.2px}
.md h3{font-size:14.5px;margin:18px 0 6px;color:#fff;text-transform:none}
.md p{margin:0 0 12px}
.md ul,.md ol{margin:0 0 14px;padding-left:22px}
.md li{margin:4px 0}
.md li::marker{color:var(--acc-d)}
.md code{
  font-family:var(--mono);font-size:.86em;background:#1b2531;border:1px solid var(--line);
  padding:1.5px 5px;border-radius:5px;color:#ffd866;white-space:nowrap
}
.md pre{
  background:#0a0e13;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;overflow-x:auto;
  margin:0 0 16px;font-size:13px;line-height:1.65;position:relative
}
.md pre code{background:none;border:none;padding:0;color:#d6e2ee;white-space:pre;font-size:inherit}
.md .note{
  border-left:3px solid var(--blue);background:rgba(88,166,255,.07);padding:11px 14px;border-radius:0 8px 8px 0;
  margin:0 0 16px;font-size:13.6px;color:#c3d3e6
}
.md .warn{border-left-color:var(--warn);background:rgba(227,179,65,.08)}
.md .tip{border-left-color:var(--ok);background:rgba(63,185,80,.07)}
.md .note strong{color:#fff}
.md hr{border:none;border-top:1px solid var(--line);margin:22px 0}
.k{color:var(--kw)}.s{color:var(--str)}.n{color:var(--num)}.c{color:var(--com)}.f{color:var(--fn)}.p{color:var(--mut)}

.task{
  margin:22px 0 0;border:1px solid #4a4110;background:linear-gradient(180deg,rgba(247,223,30,.09),rgba(247,223,30,.03));
  border-radius:12px;padding:16px 18px
}
.task h3{margin:0 0 8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--acc);display:flex;align-items:center;gap:7px}
.task .md{font-size:14.2px;color:#e7e2c6}
.task .md p:last-child{margin-bottom:0}
.task .md code{background:#2a2710;border-color:#4a4110}

.hintbox{margin:14px 0 0;padding:12px 15px;border-radius:10px;background:var(--bg3);border:1px dashed var(--line2);font-size:13.4px;color:#b9c7d8;display:none}
.hintbox.show{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

.row-btns{display:flex;gap:9px;margin-top:18px;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:9px;font-weight:650;font-size:13.5px;
  border:1px solid var(--line2);background:var(--bg3);color:var(--txt);transition:.15s
}
.btn:hover{background:var(--bg4);border-color:#46556580}
.btn.small{padding:6px 11px;font-size:12.5px;border-radius:8px}
.btn.gold{background:var(--acc);color:#141000;border-color:var(--acc);font-weight:800}
.btn.gold:hover{background:#ffe94d}
.btn.ghost{background:transparent;border-color:transparent;color:var(--mut)}
.btn.ghost:hover{background:var(--bg3);color:var(--txt)}
.btn.blue{background:rgba(88,166,255,.14);border-color:rgba(88,166,255,.4);color:#a9d1ff}
.btn.blue:hover{background:rgba(88,166,255,.22)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* test results */
.tests{margin-top:16px;display:none}
.tests.show{display:block;animation:fade .25s ease}
.tests .head{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:700;margin-bottom:9px}
.tests .head .badge{padding:2px 9px;border-radius:99px;font-size:11.5px;background:var(--bg4);color:var(--mut)}
.tests .head .badge.ok{background:rgba(63,185,80,.16);color:#6ee787}
.tests .head .badge.bad{background:rgba(255,107,107,.14);color:#ffa8a8}
.tlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.tlist li{
  display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:9px;background:var(--bg2);
  border:1px solid var(--line);font-size:13.2px;line-height:1.45
}
.tlist li.pass{border-color:rgba(63,185,80,.35);background:rgba(63,185,80,.07)}
.tlist li.fail{border-color:rgba(255,107,107,.3);background:rgba(255,107,107,.06)}
.tlist .mk{font-size:12px;flex:0 0 auto;margin-top:2px}
.tlist .msg{color:#cbd6e2}
.tlist .why{display:block;color:#ff9d9d;font-family:var(--mono);font-size:11.5px;margin-top:4px;white-space:pre-wrap;word-break:break-word}

.done-banner{
  display:none;margin-top:16px;padding:16px 18px;border-radius:12px;align-items:center;gap:14px;flex-wrap:wrap;
  background:linear-gradient(100deg,rgba(63,185,80,.16),rgba(63,185,80,.05));border:1px solid rgba(63,185,80,.4)
}
.done-banner.show{display:flex;animation:fade .3s ease}
.done-banner .em{font-size:24px}
.done-banner b{display:block;font-size:14.5px}
.done-banner span{font-size:12.8px;color:#9db6a4}

/* work pane */
.work{display:flex;flex-direction:column;min-height:0;background:var(--bg2)}
.editor-shell{display:flex;flex-direction:column;min-height:0;flex:1 1 52%}
.out-shell{display:flex;flex-direction:column;min-height:0;flex:1 1 48%;border-top:1px solid var(--line)}
.ehead{
  display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--line);
  min-height:44px;flex-wrap:wrap
}
.filename{font-family:var(--mono);font-size:12.5px;color:var(--mut);display:flex;align-items:center;gap:7px}
.filename .dirty{width:7px;height:7px;border-radius:50%;background:var(--acc);display:none}
.filename .dirty.on{display:block}
.ehead .spacer{flex:1}
.kbd{font-family:var(--mono);font-size:10.5px;padding:1px 5px;border:1px solid var(--line2);border-radius:4px;color:var(--mut);background:var(--bg)}

.editor-wrap{position:relative;flex:1;min-height:0;display:flex;overflow:hidden;background:#0a0e13}
.gutter{
  padding:14px 8px 14px 12px;text-align:right;font-family:var(--mono);font-size:13px;line-height:1.65;
  color:#3d4b5c;user-select:none;background:#0a0e13;border-right:1px solid #16202b;overflow:hidden;flex:0 0 auto;
  white-space:pre;min-width:44px
}
.code-area{position:relative;flex:1;min-width:0;overflow:hidden}
.hl,.editor{
  margin:0;padding:14px 16px;font-family:var(--mono);font-size:13px;line-height:1.65;tab-size:2;
  white-space:pre;border:0;outline:none;letter-spacing:0
}
.hl{position:absolute;inset:0;pointer-events:none;overflow:hidden;color:#d6e2ee;z-index:1}
.editor{
  position:absolute;inset:0;width:100%;height:100%;background:transparent;color:transparent;caret-color:var(--acc);
  resize:none;overflow:auto;z-index:2;font-size:13px;line-height:1.65
}
.editor::selection{background:rgba(88,166,255,.28);color:transparent}
.hl .k{color:var(--kw)}.hl .s{color:var(--str)}.hl .n{color:var(--num)}
.hl .c{color:var(--com);font-style:italic}.hl .f{color:var(--fn)}.hl .p{color:#8b9aad}

.tabs{display:flex;gap:2px;padding:0 8px;background:var(--bg2);border-bottom:1px solid var(--line);align-items:center}
.tab{
  padding:9px 13px;font-size:12.5px;color:var(--mut);border-bottom:2px solid transparent;font-weight:600;
  display:flex;align-items:center;gap:6px
}
.tab.active{color:var(--txt);border-bottom-color:var(--acc)}
.tab .n{background:var(--bg4);border-radius:99px;padding:0 6px;font-size:10.5px;font-variant-numeric:tabular-nums}
.tabs .spacer{flex:1}

.console{
  flex:1;overflow-y:auto;padding:10px 14px 20px;font-family:var(--mono);font-size:12.6px;line-height:1.6;
  background:#0a0e13;min-height:0
}
.console .ln{display:flex;gap:9px;padding:3px 0;border-bottom:1px solid #131a22;white-space:pre-wrap;word-break:break-word}
.console .ln .ic{color:#3d4b5c;flex:0 0 auto;font-size:10.5px;margin-top:3px;width:12px}
.console .ln.log{color:#cdd9e5}
.console .ln.warn{color:var(--warn);background:rgba(227,179,65,.06)}
.console .ln.error{color:#ff9d9d;background:rgba(255,107,107,.07)}
.console .ln.sys{color:#7f8fa1;font-style:italic}
.console .ln.ok{color:#6ee787}
.console .empty{color:#48586a;font-style:italic;padding:14px 2px;display:flex;gap:8px;align-items:center}
.iframe-wrap{flex:1;min-height:0;display:none;background:#fff}
.iframe-wrap.show{display:block}
.iframe-wrap iframe{width:100%;height:100%;border:0;display:block;background:#fff}
.badge-dot{width:6px;height:6px;border-radius:50%;background:var(--mut);display:inline-block}
.badge-dot.live{background:var(--ok);box-shadow:0 0 0 3px rgba(63,185,80,.18)}

/* toast */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#f7df1e;color:#141000;
  font-weight:750;font-size:13.5px;padding:11px 18px;border-radius:11px;box-shadow:0 12px 30px #0009;
  opacity:0;pointer-events:none;transition:.28s;z-index:200;display:flex;gap:9px;align-items:center
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* welcome */
.welcome{padding:0 0 10px;border-bottom:1px solid var(--line);margin-bottom:18px}
.welcome h1{margin-bottom:6px}

/* scrim for mobile drawer */
.scrim{display:none;position:fixed;inset:56px 0 0;background:#000a;z-index:19;backdrop-filter:blur(2px)}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .main{grid-template-columns:1fr 1fr}
  .lesson-pane{padding:22px 22px 60px}
}
@media (max-width:940px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;top:56px;bottom:0;left:0;width:290px;z-index:20;transform:translateX(-100%);transition:transform .25s ease}
  body.nav-open .sidebar{transform:none}
  body.nav-open .scrim{display:block}
  .menu-btn{display:grid}
  .main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) minmax(0,1fr)}
  .lesson-pane{border-right:0;border-bottom:1px solid var(--line);padding:20px 18px 40px}
  .work{border-top:1px solid var(--line)}
  .progress-mini{display:none}
}
@media (max-width:600px){
  .lesson-pane h1{font-size:21px}
  .brand small{display:none}
  .md{font-size:14px}
  .ehead{gap:6px}
  .ehead .kbd{display:none}
}

/* ---------- tela inicial (escolha de lições) ---------- */
.view-home .main{grid-template-columns:1fr}
.view-home .work{display:none}
.home{padding:6px 0 50px;max-width:1080px;margin:0 auto}
.hero{
  position:relative;border:1px solid var(--line);border-radius:16px;padding:26px 30px 20px;margin-bottom:28px;
  background:radial-gradient(120% 150% at 0% 0%,rgba(247,223,30,.11),transparent 58%),linear-gradient(180deg,#141d28,#101822);
  overflow:hidden
}
.hero:after{
  content:"JS";position:absolute;right:26px;top:14px;font-family:var(--mono);font-weight:800;font-size:96px;
  color:rgba(247,223,30,.06);letter-spacing:-6px;pointer-events:none;user-select:none
}
.hero-tag{
  display:inline-block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:800;color:var(--acc);
  background:rgba(247,223,30,.1);border:1px solid rgba(247,223,30,.24);padding:4px 10px;border-radius:99px
}
.hero h1{font-size:30px;line-height:1.15;letter-spacing:-.9px;margin:12px 0 8px;max-width:24ch}
.hero-sub{color:#b3c1d1;font-size:14.4px;max-width:66ch;margin:0 0 16px}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.btn.big{padding:12px 20px;font-size:14.4px;border-radius:11px}
.hero-progress{display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--mut);flex-wrap:wrap}
.hero-progress .track{height:8px;flex:1 1 200px;max-width:300px;background:#0c121a;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.hero-progress .fill{height:100%;background:linear-gradient(90deg,var(--acc),#8fd14f);border-radius:99px;transition:width .4s}
.mod-sec{margin-bottom:30px}
.mod-sec-head{display:flex;align-items:center;gap:10px;padding-bottom:10px;margin-bottom:13px;border-bottom:1px solid var(--line)}
.mod-sec-head .ico{font-size:17px}
.mod-sec-head h2{font-size:16px;margin:0;letter-spacing:-.3px;font-weight:750}
.mod-sec-count{
  margin-left:auto;font-size:11.5px;color:var(--mut);font-variant-numeric:tabular-nums;
  background:var(--bg3);border:1px solid var(--line);padding:2px 9px;border-radius:99px
}
.mod-sec-count.full{color:#6ee787;border-color:rgba(63,185,80,.35);background:rgba(63,185,80,.1)}
.lesson-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:10px}
.card{
  display:flex;flex-direction:column;gap:9px;text-align:left;padding:12px 14px 14px;border-radius:12px;
  border:1px solid var(--line);background:var(--bg2);transition:.15s;min-height:82px
}
.card:hover{border-color:#41505f;background:var(--bg3);transform:translateY(-1px);box-shadow:0 6px 18px #0006}
.card:active{transform:none}
.card.done{border-color:rgba(63,185,80,.32);background:linear-gradient(180deg,rgba(63,185,80,.07),var(--bg2))}
.card-top{display:flex;align-items:center;gap:8px;font-size:10.5px;color:var(--mut)}
.card-num{
  width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:var(--bg4);
  font-family:var(--mono);font-size:10.5px;color:#cbd6e2;font-weight:700;flex:0 0 auto
}
.card.done .card-num{background:rgba(63,185,80,.18);color:#6ee787}
.card-tag{font-size:9px;letter-spacing:.07em;padding:2px 6px;border-radius:99px;background:rgba(88,166,255,.14);color:#a9d1ff;font-weight:800}
.card-min{margin-left:auto;white-space:nowrap}
.card-title{font-size:13.4px;font-weight:640;color:var(--txt);line-height:1.32}
.home-link{margin-bottom:6px;color:#a9d1ff}
.home-link .home-ico{width:15px;text-align:center;flex:0 0 auto;font-size:13px;margin-top:1px}

/* ---------- responsive extra ---------- */
@media (max-width:940px){
  .view-home .main{grid-template-rows:1fr}
  .hero{padding:24px 20px 20px}
  .hero h1{font-size:25px}
  .hero:after{font-size:64px;right:14px}
  .lesson-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
  .home{padding-bottom:30px}
  .hero-actions{gap:8px}
  .hero-actions .btn{flex:1 1 100%;justify-content:center}
}

/* ---------- barra de ferramentas da tela inicial ---------- */
.home-tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:24px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;font-size:12.5px;font-weight:650;
  border:1px solid var(--line);background:var(--bg2);color:var(--mut);transition:.15s
}
.chip b{font-weight:700;font-size:11px;color:#9fb0c4;background:var(--bg4);border-radius:99px;padding:1px 6px;font-variant-numeric:tabular-nums}
.chip:hover{color:var(--txt);border-color:#3c4b5d}
.chip.on{background:rgba(247,223,30,.12);border-color:rgba(247,223,30,.4);color:var(--acc)}
.chip.on b{background:rgba(247,223,30,.2);color:var(--acc)}
.viewswitch{margin-left:auto;display:flex;gap:2px;padding:3px;background:var(--bg2);border:1px solid var(--line);border-radius:10px}
.vs{padding:6px 12px;border-radius:8px;font-size:12.3px;font-weight:650;color:var(--mut);transition:.15s;white-space:nowrap}
.vs:hover{color:var(--txt)}
.vs.on{background:var(--bg4);color:var(--txt);box-shadow:0 1px 0 #0003}
.mod-next{
  font-size:11.5px;font-weight:650;color:#a9d1ff;background:rgba(88,166,255,.12);border:1px solid rgba(88,166,255,.3);
  padding:3px 9px;border-radius:99px;transition:.15s;white-space:nowrap
}
.mod-next:hover{background:rgba(88,166,255,.22)}
.mod-complete{font-size:11.5px;font-weight:650;color:#6ee787;background:rgba(63,185,80,.12);border:1px solid rgba(63,185,80,.3);padding:3px 9px;border-radius:99px;white-space:nowrap}
.home-empty{
  display:flex;flex-direction:column;align-items:center;gap:10px;padding:46px 20px;border:1px dashed var(--line2);
  border-radius:14px;color:var(--mut);font-size:13.5px;text-align:center
}
.home-empty span{font-size:26px}

/* ---------- visão trilha ---------- */
.trail{position:relative;padding:6px 0 10px}
.trail:before{
  content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;transform:translateX(-1px);
  background:repeating-linear-gradient(180deg,var(--line2) 0 7px,transparent 7px 14px);opacity:.75
}
.node-row{
  display:grid;grid-template-columns:1fr 60px 1fr;align-items:center;width:100%;text-align:left;
  padding:5px 0;position:relative;transition:.15s
}
.node-row .node{
  grid-column:2;justify-self:center;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
  background:var(--bg);border:2px solid var(--line2);color:#b8c6d6;font-family:var(--mono);font-size:12.5px;font-weight:700;
  z-index:1;transition:.18s
}
.node-row.L .node-card{grid-column:1;justify-self:end;text-align:right;align-items:flex-end}
.node-row.R .node-card{grid-column:3;justify-self:start;text-align:left}
.node-card{
  display:flex;flex-direction:column;gap:3px;max-width:330px;padding:10px 14px;border-radius:12px;
  border:1px solid var(--line);background:var(--bg2);transition:.15s
}
.node-title{font-size:13.4px;font-weight:640;color:var(--txt);line-height:1.3}
.node-meta{font-size:10.8px;color:var(--mut);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.node-row.L .node-meta{justify-content:flex-end}
.node-row:hover .node-card{border-color:#41505f;background:var(--bg3);transform:translateY(-1px);box-shadow:0 6px 16px #0006}
.node-row:hover .node{border-color:#5a6b7d;color:#fff}
.node-row.done .node{border-color:var(--ok);background:rgba(63,185,80,.16);color:#6ee787}
.node-row.done .node-card{border-color:rgba(63,185,80,.3);background:linear-gradient(180deg,rgba(63,185,80,.07),var(--bg2))}
.node-row.next .node{
  border-color:var(--acc);color:var(--acc);background:rgba(247,223,30,.1);
  box-shadow:0 0 0 5px rgba(247,223,30,.08)
}
.node-row.next .node-card{border-color:rgba(247,223,30,.45);background:linear-gradient(180deg,rgba(247,223,30,.09),var(--bg2))}
.node-here{color:var(--acc);font-weight:700}

@media (max-width:940px){
  .home-tools{gap:8px}
  .viewswitch{margin-left:0;width:100%;justify-content:center}
  .vs{flex:1;justify-content:center;text-align:center}
}
@media (max-width:600px){
  .mod-sec-head{flex-wrap:wrap;gap:8px}
  .mod-sec-head h2{font-size:14.5px;flex:1 1 auto}
  .mod-sec-count{margin-left:auto}
  .mod-next,.mod-complete{order:3}
  .chip{padding:6px 10px;font-size:12px}
  .trail:before{left:21px;transform:none}
  .node-row{grid-template-columns:44px 1fr;gap:10px}
  .node-row .node{grid-column:1;justify-self:start;width:38px;height:38px;font-size:11.5px}
  .node-row.L .node-card,.node-row.R .node-card{grid-column:2;justify-self:start;text-align:left;align-items:flex-start;max-width:none;width:100%}
  .node-row.L .node-meta{justify-content:flex-start}
}

<script>
window.COURSE = [{"id":"intro","title":"Introdução ao JavaScript","icon":"🚀","lessons":[{"id":"m1l1","title":"Seu primeiro código","minutes":5,"theory":"\n## Bem-vindo ao curso\n\nJavaScript é a linguagem de programação da web. Ela roda no seu navegador agora mesmo — e também em servidores (com Node.js), aplicativos, jogos e até robôs.\n\nNeste curso você escreve código de verdade desde a primeira lição. O painel da direita é um editor real: você digita, executa e vê o resultado na hora. Não existe botão de \"assistir vídeo\" — aqui se aprende fazendo.\n\n## console.log\n\nA instrução mais usada por quem está começando é `console.log()`. Ela **imprime** um valor no console, que é o painel onde os programadores observam o que o programa está fazendo.\n\n```js\nconsole.log(\"Olá, mundo!\");\n// Console:  Olá, mundo!\n```\n\nVocê pode imprimir qualquer coisa: textos (entre aspas), números, resultados de contas e variáveis.\n\n```js\nconsole.log(2 + 2);        // 4\nconsole.log(\"2 + 2\");      // 2 + 2  (entre aspas é texto!)\n```\n\n> [tip] O console é o seu melhor amigo. Sempre que quiser saber o valor de algo, imprima.\n","task":"\nEscreva **duas linhas** usando `console.log`:\n\n1. A mensagem `Olá, mundo!`\n2. Uma segunda linha com o seu nome (ou o que você quiser)\n","starter":"// Escreva seu primeiro código abaixo\n\n","solution":"console.log(\"Olá, mundo!\");\nconsole.log(\"Meu nome é Ana\");\n","hint":"Texto sempre entre aspas: `console.log(\"Olá, mundo!\");` — e não esqueça do ponto e vírgula no final (ele é opcional em JavaScript, mas ajuda a organizar).","tests":[{"msg":"Você deve imprimir a mensagem Olá, mundo! com console.log","code":"__normalize(__printed()).includes(\"olá, mundo\")"},{"msg":"Imprima pelo menos duas linhas no console","code":"__logs.length >= 2"}]},{"id":"m1l2","title":"Variáveis: let e const","minutes":6,"theory":"\n## Guardando valores\n\nUma **variável** é um espaço com nome para guardar um valor. Em JavaScript moderno existem duas palavras-chave para criar variáveis:\n\n- `const` — valor que **não** será trocado (constante). Use sempre que puder.\n- `let` — valor que **pode** mudar durante o programa.\n\n```js\nconst nome = \"Ana\";\nlet idade = 25;\n\nidade = 26;              // ok, let pode mudar\nconsole.log(nome, idade); // Ana 26\n```\n\nSe você tentar trocar uma `const`, o JavaScript reclama:\n\n```js\nconst pi = 3.14;\npi = 3;   // TypeError: Assignment to constant variable.\n```\n\n> [warn] Evite `var`: é a forma antiga, tem regras de escopo confusas e hoje só aparece em código legado.\n\n## Nomes de variáveis\n\nUse nomes descritivos, sem espaços nem acentos, começando com letra, `_` ou `$`. O padrão da comunidade é **camelCase**: `nomeCompleto`, `precoTotal`, `idadeMinima`.\n","task":"\nCrie duas variáveis:\n\n- `nome` — uma **constante** (`const`) com o seu nome, como texto.\n- `idade` — uma variável (`let`) com a sua idade, como **número** (sem aspas).\n\nNo final, imprima as duas com `console.log(nome, idade)`.\n","starter":"// 1. Crie a constante `nome`\n\n\n// 2. Crie a variável `idade`\n\n\n// 3. Imprima as duas\n\n","solution":"const nome = \"Ana\";\nlet idade = 25;\n\nconsole.log(nome, idade);\n","hint":"Número não leva aspas: `let idade = 25;` (com aspas viraria texto `\"25\"`).","tests":[{"msg":"Crie uma variável chamada nome","code":"typeof nome !== \"undefined\" "},{"msg":"nome deve ser um texto (string) não vazio","code":"typeof nome === \"string\" && nome.trim().length > 0"},{"msg":"Crie uma variável chamada idade","code":"typeof idade !== \"undefined\" "},{"msg":"idade deve ser um número","code":"typeof idade === \"number\" && Number.isFinite(idade)"},{"msg":"Use let para a idade (ela vai poder mudar)","code":"/\\blet\\s+idade\\b/.test(__code)"},{"msg":"Use const para o nome","code":"/\\bconst\\s+nome\\b/.test(__code)"}]},{"id":"m1l3","title":"Tipos de dados","minutes":7,"theory":"\n## Os tipos primitivos\n\nJavaScript tem poucos tipos básicos, e você vai usar quase sempre os quatro primeiros:\n\n| Tipo | Exemplos | Para que serve |\n|---|---|---|\n| `string` | `\"Ana\"`, `'oi'`, `` `tchau` `` | textos |\n| `number` | `10`, `-3.5`, `0.1` | números (inteiros e decimais) |\n| `boolean` | `true`, `false` | sim/não, ligado/desligado |\n| `undefined` | `undefined` | \"ainda não tem valor\" |\n| `null` | `null` | \"vazio, de propósito\" |\n| `object` | `{}`, `[]` | estruturas (vêm mais adiante) |\n\n## Descobrindo o tipo com typeof\n\nO operador `typeof` devolve o tipo de um valor, como texto:\n\n```js\nconsole.log(typeof \"Ana\");   // string\nconsole.log(typeof 42);      // number\nconsole.log(typeof true);    // boolean\nconsole.log(typeof undefined); // undefined\nconsole.log(typeof null);    // object  ← peculiaridade histórica do JS\n```\n\n> [warn] `typeof null` devolve `\"object\"`. É um bug antigo da linguagem que nunca foi corrigido. Guarde isso: `null` é um primitivo.\n","task":"\nCrie quatro variáveis:\n\n- `produto` — texto: `\"Caneta\"`.\n- `preco` — número: `2.5`.\n- `disponivel` — booleano: `true`.\n- `desconto` — uma variável **sem valor** (use `let` e não atribua nada).\n\nDepois imprima `typeof` de cada uma.\n","starter":"// Crie as quatro variáveis\n\n\n// Imprima os tipos\nconsole.log(typeof produto);\n\n","solution":"const produto = \"Caneta\";\nconst preco = 2.5;\nconst disponivel = true;\nlet desconto;\n\nconsole.log(typeof produto, typeof preco, typeof disponivel, typeof desconto);\n","hint":"Para deixar uma variável sem valor, basta declarar: `let desconto;` — o valor dela será `undefined`.","tests":[{"msg":"produto deve ser o texto \"Caneta\"","code":"produto === \"Caneta\" "},{"msg":"preco deve ser o número 2.5","code":"preco === 2.5"},{"msg":"disponivel deve ser o booleano true","code":"disponivel === true"},{"msg":"desconto deve existir e valer undefined (declarada sem valor)","code":"typeof desconto === \"undefined\" && /\\b(?:let|var)\\s+desconto\\b/.test(__code)"}]},{"id":"m1l4","title":"Operadores aritméticos","minutes":7,"theory":"\n## Contas em JavaScript\n\n```js\nconsole.log(10 + 3);   // 13  soma\nconsole.log(10 - 3);   // 7   subtração\nconsole.log(10 * 3);   // 30  multiplicação\nconsole.log(10 / 4);   // 2.5 divisão\nconsole.log(10 % 3);   // 1   resto da divisão\nconsole.log(2 ** 5);   // 32  potência\n```\n\nO `%` (módulo) parece estranho, mas é utilíssimo: `n % 2 === 0` descobre se um número é par.\n\n## Precedência\n\nA ordem é a da matemática: parênteses primeiro, depois potência, multiplicação/divisão, soma/subtração.\n\n```js\nconsole.log(2 + 3 * 4);    // 14\nconsole.log((2 + 3) * 4);  // 20\n```\n\n## Atalhos que você vai ver muito\n\n```js\nlet total = 10;\ntotal += 5;   // total = 15\ntotal -= 2;   // total = 13\ntotal *= 2;   // total = 26\ntotal++;      // total = 27\n```\n\n> [warn] Cuidado com `+` e texto: `\"5\" + 1` resulta em `\"51\"`, porque o `+` cola textos (concatena). Já `\"5\" - 1` resulta em `4`, porque a subtração converte para número. Confuso, né? Por isso usamos números de verdade.\n","task":"\nUma loja vendeu **3 canetas a R$ 30 cada**. Comece com:\n\n```js\nconst preco = 30;\nconst quantidade = 3;\n```\n\nCalcule:\n\n- `total` — preço × quantidade.\n- `troco` — quanto sobra de uma nota de R$ 100 (ou seja, `100 - total`).\n- `resto` — o resto da divisão de `total` por `7`.\n\nImprima os três valores.\n","starter":"const preco = 30;\nconst quantidade = 3;\n\n// calcule total, troco e resto\n\n\nconsole.log(total, troco, resto);\n","solution":"const preco = 30;\nconst quantidade = 3;\n\nconst total = preco * quantidade;\nconst troco = 100 - total;\nconst resto = total % 7;\n\nconsole.log(total, troco, resto);\n","hint":"Multiplicação usa `*` (e não `x` nem `·`). O resto da divisão usa `%`: `total % 7`.","tests":[{"msg":"total deve ser preco * quantidade (90)","code":"total === 90"},{"msg":"troco deve ser 100 - total (10)","code":"troco === 10"},{"msg":"resto deve ser o resto da divisão de total por 7 (6)","code":"resto === 90 % 7"},{"msg":"Use os operadores no cálculo (não digite os resultados na mão)","code":"/\\*/.test(__code) && /%/.test(__code)"}]},{"id":"m1l5","title":"Template strings","minutes":6,"theory":"\n## Juntando texto e valores\n\nAntigamente a gente colava textos com `+`:\n\n```js\nconst nome = \"Ana\";\nconsole.log(\"Olá, \" + nome + \"! Você tem \" + 25 + \" anos.\");\n```\n\nFunciona, mas é fácil errar um espaço ou uma aspa. A solução moderna são as **template strings** (ou templates literais): textos escritos com **crase** (`` ` ``), onde qualquer expressão JavaScript entra dentro de `${ }`.\n\n```js\nconst nome = \"Ana\";\nconst idade = 25;\n\nconsole.log(`Olá, ${nome}! Você tem ${idade} anos.`);\n// Olá, Ana! Você tem 25 anos.\n\nconsole.log(`Daqui a 10 anos você terá ${idade + 10}.`);\n```\n\n## Vantagem extra: várias linhas\n\n```js\nconst recado = `Primeira linha\nsegunda linha\nterceira linha`;\n```\n\nCom crase, a quebra de linha do seu código faz parte do texto. Sem crase, isso exigiria `\\n` em cada linha.\n\n> [tip] A tecla de crase fica ao lado do 1 no teclado (com Shift + ´ ou no teclado numérico, dependendo do layout).\n","task":"\nVocê recebeu estas duas variáveis:\n\n```js\nconst nome = \"Ana\";\nconst idade = 25;\n```\n\nCrie uma constante `mensagem` usando **template string** (com crase) que produza exatamente:\n\n```\nAna tem 25 anos\n```\n\nImprima `mensagem`.\n","starter":"const nome = \"Ana\";\nconst idade = 25;\n\n// use crase e ${ } para montar a mensagem\nconst mensagem = \"\";\n\nconsole.log(mensagem);\n","solution":"const nome = \"Ana\";\nconst idade = 25;\n\nconst mensagem = `${nome} tem ${idade} anos`;\n\nconsole.log(mensagem);\n","hint":"Fica assim: `` const mensagem = `${nome} tem ${idade} anos`; `` — crase no começo e no fim, e as variáveis dentro de `${ }`.","tests":[{"msg":"mensagem deve ser exatamente \"Ana tem 25 anos\"","code":"typeof mensagem === \"string\" && mensagem.trim() === 'Ana tem 25 anos'"},{"msg":"Use template string (crase + ${ }) em vez de concatenar com +","code":"__code.includes(\"`\") && __code.includes(\"${\")"}]},{"id":"m1l6","title":"Desafio: ficha de cadastro","minutes":10,"theory":"\n## Hora de juntar tudo\n\nAté aqui você viu: variáveis (`const`/`let`), tipos (`string`, `number`, `boolean`), contas e template strings. Vamos montar uma ficha de cadastro completa.\n\n```js\nconst ANO_ATUAL = 2026;\nconst nome = \"Ana\";\nconst nascimento = 2001;\n\nconst idade = ANO_ATUAL - nascimento;\nconsole.log(`${nome} tem ${idade} anos.`);\n```\n\nRepare em dois detalhes:\n\n1. `ANO_ATUAL` está em MAIÚSCULAS — é uma convenção para constantes \"globais\", valores fixos que o programa inteiro usa.\n2. A idade é **calculada**, não digitada. Código bom calcula em vez de repetir números soltos.\n","task":"\nMonte a ficha de uma pessoa. Comece com:\n\n```js\nconst ANO_ATUAL = 2026;\nconst nome = \"Ana\";\nconst sobrenome = \"Silva\";\nconst anoNascimento = 2001;\n```\n\nVocê deve criar:\n\n- `nomeCompleto` — nome + sobrenome separados por um espaço (use template string ou concatenação).\n- `idade` — `ANO_ATUAL - anoNascimento`.\n- `apresentacao` — um texto como `Ana Silva tem 25 anos e nasceu em 2001.` (use as variáveis, não digite os valores).\n\nImprima `apresentacao`.\n","starter":"const ANO_ATUAL = 2026;\nconst nome = \"Ana\";\nconst sobrenome = \"Silva\";\nconst anoNascimento = 2001;\n\n// 1. nomeCompleto\nconst nomeCompleto = \"\";\n\n// 2. idade\nconst idade = 0;\n\n// 3. apresentacao\nconst apresentacao = \"\";\n\nconsole.log(apresentacao);\n","solution":"const ANO_ATUAL = 2026;\nconst nome = \"Ana\";\nconst sobrenome = \"Silva\";\nconst anoNascimento = 2001;\n\nconst nomeCompleto = `${nome} ${sobrenome}`;\nconst idade = ANO_ATUAL - anoNascimento;\nconst apresentacao = `${nomeCompleto} tem ${idade} anos e nasceu em ${anoNascimento}.`;\n\nconsole.log(apresentacao);\n","hint":"Para juntar nome e sobrenome: `` `${nome} ${sobrenome}` `` — note o espaço entre os dois `${ }`.","tests":[{"msg":"nomeCompleto deve ser \"Ana Silva\"","code":"typeof nomeCompleto === \"string\" && nomeCompleto.replace(/\\s+/g,\" \").trim() === 'Ana Silva'"},{"msg":"idade deve ser calculada como ANO_ATUAL - anoNascimento (25)","code":"idade === 25"},{"msg":"apresentacao deve conter o nome completo","code":"typeof apresentacao === \"string\" && apresentacao.includes(nomeCompleto)"},{"msg":"apresentacao deve conter a idade calculada","code":"apresentacao.includes(String(idade))"},{"msg":"apresentacao deve conter o ano de nascimento","code":"apresentacao.includes(String(anoNascimento))"}]}]},{"id":"logica","title":"Lógica e controle de fluxo","icon":"🔀","lessons":[{"id":"m2l1","title":"Booleanos e comparações","minutes":7,"theory":"\n## Comparando valores\n\nToda decisão em um programa começa com uma comparação, e toda comparação devolve um **booleano**: `true` ou `false`.\n\n```js\nconsole.log(10 > 3);    // true\nconsole.log(10 < 3);    // false\nconsole.log(10 >= 10);  // true\nconsole.log(10 <= 9);   // false\nconsole.log(10 === 10); // true  (igual)\nconsole.log(10 !== 10); // false (diferente)\n```\n\n## === versus ==\n\nJavaScript tem dois operadores de igualdade, e isso causa confusão:\n\n```js\nconsole.log(5 == \"5\");   // true   ← converte o texto para número!\nconsole.log(5 === \"5\");  // false  ← tipos diferentes\n```\n\nO `==` faz conversão automática de tipos (chamada de *coerção*) e cria surpresas como `\"\" == 0` ser `true`. O `===` compara valor **e** tipo, sem mágica.\n\n> [warn] Regra prática: use sempre `===` e `!==`. Só use `==` em situações muito específicas (como `valor == null`, que pega `null` e `undefined` juntos).\n","task":"\nComece com `const idade = 20;` e crie três constantes:\n\n- `maiorDeIdade` — `true` se a idade for 18 ou mais.\n- `temDezoito` — `true` apenas se a idade for exatamente 18.\n- `idadeComoTexto` — `true` se `idade !== \"20\"` (comparando número com texto).\n\nImprima as três.\n","starter":"const idade = 20;\n\n// crie as três constantes\n\n\nconsole.log(maiorDeIdade, temDezoito, idadeComoTexto);\n","solution":"const idade = 20;\n\nconst maiorDeIdade = idade >= 18;\nconst temDezoito = idade === 18;\nconst idadeComoTexto = idade !== \"20\";\n\nconsole.log(maiorDeIdade, temDezoito, idadeComoTexto);\n","hint":"`idade >= 18` já devolve um booleano — não precisa de `if` para isso. E `idade !== \"20\"` é `true` porque `20` (número) e `\"20\"` (texto) são diferentes em tipo.","tests":[{"msg":"maiorDeIdade deve ser true","code":"maiorDeIdade === true"},{"msg":"temDezoito deve ser false (a idade é 20)","code":"temDezoito === false"},{"msg":"idadeComoTexto deve ser true (número é diferente de texto)","code":"idadeComoTexto === true"},{"msg":"Use comparações estritas (=== ou !==)","code":"__code.includes(\"===\") || __code.includes(\"!==\")"}]},{"id":"m2l2","title":"Operadores lógicos","minutes":7,"theory":"\n## E, ou, não\n\nTrês operadores combinam condições:\n\n- `&&` (**e**) — só é `true` se **as duas** condições forem verdadeiras.\n- `||` (**ou**) — é `true` se **pelo menos uma** for verdadeira.\n- `!` (**não**) — inverte: `!true` é `false`.\n\n```js\nconst temIngresso = true;\nconst temDocumento = false;\n\nconsole.log(temIngresso && temDocumento); // false\nconsole.log(temIngresso || temDocumento); // true\nconsole.log(!temIngresso);                // false\n```\n\n## Faixas de valores\n\nPara testar \"está entre 18 e 65\", você precisa das duas condições:\n\n```js\nconst idade = 30;\nconst adulto = idade >= 18 && idade < 65;  // true\n```\n\nEscrever `18 <= idade < 65` **não funciona** em JavaScript (ele avalia da esquerda para a direita e compara booleanos com números).\n\n## Curto-circuito\n\n`&&` e `||` param de avaliar assim que sabem a resposta. Com `||` isso vira um truque para valores padrão:\n\n```js\nconst apelido = nomeDigitado || \"anônimo\";\n```\n","task":"\nNo cinema, para entrar é preciso **ter ingresso E documento**. Comece com:\n\n```js\nconst temIngresso = true;\nconst temDocumento = false;\n```\n\nCrie:\n\n- `podeEntrar` — usa `&&`.\n- `temAlgumDosDois` — usa `||`.\n- `precisaResolver` — o contrário de `podeEntrar` (use `!`).\n\nImprima os três.\n","starter":"const temIngresso = true;\nconst temDocumento = false;\n\n// crie podeEntrar, temAlgumDosDois e precisaResolver\n\n\nconsole.log(podeEntrar, temAlgumDosDois, precisaResolver);\n","solution":"const temIngresso = true;\nconst temDocumento = false;\n\nconst podeEntrar = temIngresso && temDocumento;\nconst temAlgumDosDois = temIngresso || temDocumento;\nconst precisaResolver = !podeEntrar;\n\nconsole.log(podeEntrar, temAlgumDosDois, precisaResolver);\n","hint":"`podeEntrar` será `false`, porque `temDocumento` é `false` — e com `&&` basta uma condição falsa para o resultado ser falso.","tests":[{"msg":"podeEntrar deve ser false","code":"podeEntrar === false"},{"msg":"temAlgumDosDois deve ser true","code":"temAlgumDosDois === true"},{"msg":"precisaResolver deve ser true (negação de podeEntrar)","code":"precisaResolver === true"},{"msg":"Use os três operadores: && , || e !","code":"__code.includes(\"&&\") && __code.includes(\"||\") && __code.includes(\"!\")"}]},{"id":"m2l3","title":"if, else if e else","minutes":8,"theory":"\n## Tomando decisões\n\nO `if` executa um bloco **somente se** a condição for verdadeira:\n\n```js\nconst idade = 20;\n\nif (idade >= 18) {\n  console.log(\"Pode entrar\");\n}\n```\n\nCom `else`, você diz o que fazer caso contrário:\n\n```js\nif (idade >= 18) {\n  console.log(\"Pode entrar\");\n} else {\n  console.log(\"Não pode entrar\");\n}\n```\n\n## Várias possibilidades: else if\n\nAs condições são testadas **de cima para baixo** e o primeiro `if` verdadeiro ganha. O `else` final é o \"resto\":\n\n```js\nconst nota = 7.5;\n\nif (nota >= 9) {\n  console.log(\"Excelente\");\n} else if (nota >= 7) {\n  console.log(\"Bom\");\n} else if (nota >= 5) {\n  console.log(\"Regular\");\n} else {\n  console.log(\"Reprovado\");\n}\n```\n\n> [warn] A ordem importa. Se o primeiro teste fosse `nota >= 5`, uma nota 9,5 cairia em \"Regular\" — o programa nunca chegaria ao `nota >= 9`.\n\n## Boas práticas\n\nSempre use chaves `{ }`, mesmo com uma linha só. Isso evita bugs difíceis quando alguém adiciona uma linha depois.\n","task":"\nComece com `const temperatura = 28;`. Usando `if` / `else if` / `else`, defina a variável `clima`:\n\n- acima de 25 → `\"quente\"`\n- de 18 até 25 → `\"agradável\"`\n- abaixo de 18 → `\"frio\"`\n\nComo 28 é maior que 25, o resultado esperado é `\"quente\"`. Mas escreva a lógica completa para os três casos: os testes verificam que você usou as três ramificações.\n\nImprima `clima`.\n","starter":"const temperatura = 28;\n\nlet clima;\n\n// escreva o if / else if / else\n\n\nconsole.log(clima);\n","solution":"const temperatura = 28;\n\nlet clima;\n\nif (temperatura > 25) {\n  clima = \"quente\";\n} else if (temperatura >= 18) {\n  clima = \"agradável\";\n} else {\n  clima = \"frio\";\n}\n\nconsole.log(clima);\n","hint":"Comece pelo caso mais extremo (`temperatura > 25`) e vá descendo. A última condição pode ser só `else`, porque tudo o que sobra é \"frio\".","tests":[{"msg":"clima deve ser \"quente\" para 28 graus","code":"clima === \"quente\" "},{"msg":"Use um if","code":"/if\\s*\\(/.test(__code)"},{"msg":"Use else if para o caso intermediário","code":"/else\\s+if\\s*\\(/.test(__code)"},{"msg":"Use um else final para o caso frio","code":"/else\\s*\\{/.test(__code)"}]},{"id":"m2l4","title":"switch","minutes":7,"theory":"\n## Quando há muitos casos iguais\n\nQuando você compara **o mesmo valor** com várias opções, `switch` fica mais legível que uma escada de `if`:\n\n```js\nconst dia = \"segunda\";\n\nswitch (dia) {\n  case \"segunda\":\n  case \"terça\":\n  case \"quarta\":\n  case \"quinta\":\n  case \"sexta\":\n    console.log(\"Dia útil\");\n    break;\n  case \"sábado\":\n  case \"domingo\":\n    console.log(\"Fim de semana\");\n    break;\n  default:\n    console.log(\"Dia inválido\");\n}\n```\n\nTrês detalhes essenciais:\n\n1. O `case` é comparado com `===` (valor e tipo).\n2. O `break` encerra o `switch`. **Sem ele**, a execução \"escorrega\" para o próximo caso (isso se chama *fallthrough*) — às vezes é útil, como no exemplo acima, mas normalmente é um bug.\n3. `default` é o caso \"nenhum dos anteriores\"; pode ficar em qualquer posição, mas o usual é no fim.\n\n> [tip] `switch` só serve para igualdade. Para faixas (`nota >= 7`), use `if`.\n","task":"\nComece com `const dia = \"segunda\";`.\n\nUsando `switch`, defina a variável `mensagem`:\n\n- `\"segunda\"` → `\"Começo de semana\"`\n- `\"sexta\"` → `\"Sexta-feira!\"`\n- `\"sábado\"` ou `\"domingo\"` → `\"Fim de semana\"`\n- qualquer outra coisa → `\"Dia comum\"`\n\nImprima `mensagem`.\n","starter":"const dia = \"segunda\";\n\nlet mensagem;\n\n// escreva o switch\n\n\nconsole.log(mensagem);\n","solution":"const dia = \"segunda\";\n\nlet mensagem;\n\nswitch (dia) {\n  case \"segunda\":\n    mensagem = \"Começo de semana\";\n    break;\n  case \"sexta\":\n    mensagem = \"Sexta-feira!\";\n    break;\n  case \"sábado\":\n  case \"domingo\":\n    mensagem = \"Fim de semana\";\n    break;\n  default:\n    mensagem = \"Dia comum\";\n}\n\nconsole.log(mensagem);\n","hint":"Para dois casos com a mesma ação, empilhe os `case` sem `break` entre eles: `case \"sábado\": case \"domingo\": mensagem = \"Fim de semana\"; break;`","tests":[{"msg":"mensagem deve ser \"Começo de semana\" para segunda","code":"mensagem === \"Começo de semana\" "},{"msg":"Use switch","code":"/switch\\s*\\(/.test(__code)"},{"msg":"Use case para segunda, sexta e o fim de semana","code":"(/case\\s*[\"']segunda[\"']/.test(__code)) && (/case\\s*[\"']sexta[\"']/.test(__code)) && (/case\\s*[\"']domingo[\"']/.test(__code))"},{"msg":"Use break (ou um return) para encerrar os casos","code":"/break/.test(__code)"},{"msg":"Use default para os outros dias","code":"/default\\s*:/.test(__code)"}]},{"id":"m2l5","title":"Ternário e valores truthy/falsy","minutes":7,"theory":"\n## if de uma linha: o operador ternário\n\nPara escolher entre dois valores, existe uma forma curta:\n\n```js\ncondição ? valorSeVerdadeiro : valorSeFalso\n```\n\n```js\nconst idade = 20;\nconst status = idade >= 18 ? \"adulto\" : \"menor\";\nconsole.log(status); // adulto\n```\n\nIsso é ótimo para atribuições simples. **Não** é bom para lógica com vários passos: ternários aninhados viram um quebra-cabeça.\n\n## Truthy e falsy\n\nEm qualquer lugar onde o JS espera um booleano, ele converte o valor. Os valores **falsy** (que viram `false`) são apenas oito:\n\n```js\nfalse, 0, -0, 0n, \"\", null, undefined, NaN\n```\n\nTodo o resto é **truthy** — incluindo `\"0\"`, `\"false\"`, `[]` e `{}`.\n\n```js\nif (\"0\") console.log(\"passa!\");   // imprime: texto não vazio é truthy\nif ([])  console.log(\"passa!\");   // imprime: array vazio é truthy\n```\n\n## Convertendo de propósito\n\n```js\nBoolean(0);      // false\nBoolean(\"oi\");   // true\n!!\"\";            // false  (o ! duplo converte para booleano)\n```\n","task":"\nComece com:\n\n```js\nconst pontos = 72;\nconst nomeDigitado = \"\";\n```\n\nCrie:\n\n- `resultado` — usando **ternário**: `\"Aprovado\"` se `pontos >= 60`, senão `\"Reprovado\"`.\n- `nomeFinal` — usando `||`: `nomeDigitado` se ele tiver valor, senão `\"Anônimo\"`.\n- `temNome` — o valor de `nomeDigitado` convertido para booleano (use `Boolean(...)`).\n\nImprima os três.\n","starter":"const pontos = 72;\nconst nomeDigitado = \"\";\n\n// 1. resultado com ternário\nconst resultado = \"\";\n\n// 2. nomeFinal com ||\nconst nomeFinal = \"\";\n\n// 3. temNome com Boolean()\nconst temNome = false;\n\nconsole.log(resultado, nomeFinal, temNome);\n","solution":"const pontos = 72;\nconst nomeDigitado = \"\";\n\nconst resultado = pontos >= 60 ? \"Aprovado\" : \"Reprovado\";\nconst nomeFinal = nomeDigitado || \"Anônimo\";\nconst temNome = Boolean(nomeDigitado);\n\nconsole.log(resultado, nomeFinal, temNome);\n","hint":"Texto vazio `\"\"` é falsy, então `\"\" || \"Anônimo\"` resulta em `\"Anônimo\"`.","tests":[{"msg":"resultado deve ser \"Aprovado\"","code":"resultado === \"Aprovado\" "},{"msg":"nomeFinal deve ser \"Anônimo\" (texto vazio é falsy)","code":"nomeFinal === \"Anônimo\" "},{"msg":"temNome deve ser false","code":"temNome === false"},{"msg":"Use o operador ternário ( ? : )","code":"/\\?[^;]*:/.test(__code)"},{"msg":"Use || para o valor padrão do nome","code":"__code.includes(\"||\")"}]},{"id":"m2l6","title":"Desafio: classificação de notas","minutes":12,"theory":"\n## Um problema real\n\nEscolas precisam converter notas numéricas em conceitos. Esse tipo de regra aparece o tempo todo em software de verdade: definir faixas, validar entradas, decidir o que mostrar.\n\n```js\nconst nota = 7.5;\nlet conceito;\n\nif (nota >= 9) {\n  conceito = \"A\";\n} else if (nota >= 7) {\n  conceito = \"B\";\n} else if (nota >= 5) {\n  conceito = \"C\";\n} else {\n  conceito = \"D\";\n}\n```\n\nRepare que a nota 9,5 não é testada em `nota >= 7`: o primeiro `if` já capturou. Isso é o que torna a ordem das condições tão importante.\n","task":"\nComece com `const nota = 7.5;`.\n\nCrie as variáveis:\n\n- `conceito` — `\"A\"` se nota ≥ 9; `\"B\"` se ≥ 7; `\"C\"` se ≥ 5; `\"D\"` se for menor que 5. Use `if` / `else if` / `else`.\n- `valida` — `true` só se a nota estiver entre 0 e 10 (inclusive). Use `&&`.\n- `situacao` — com ternário: `\"Aprovado\"` se o conceito for `\"A\"`, `\"B\"` ou `\"C\"`; senão `\"Reprovado\"`.\n\nImprima tudo.\n","starter":"const nota = 7.5;\n\nlet conceito;\nconst valida = false;\nlet situacao;\n\n// 1. conceito com if / else if / else\n\n\n// 2. valida (entre 0 e 10)\n\n\n// 3. situacao com ternário\n\n\nconsole.log(nota, conceito, valida, situacao);\n","solution":"const nota = 7.5;\n\nlet conceito;\n\nif (nota >= 9) {\n  conceito = \"A\";\n} else if (nota >= 7) {\n  conceito = \"B\";\n} else if (nota >= 5) {\n  conceito = \"C\";\n} else {\n  conceito = \"D\";\n}\n\nconst valida = nota >= 0 && nota <= 10;\nconst situacao = conceito !== \"D\" ? \"Aprovado\" : \"Reprovado\";\n\nconsole.log(nota, conceito, valida, situacao);\n","hint":"Para `situacao` sem escrever três comparações, use: `conceito !== \"D\" ? \"Aprovado\" : \"Reprovado\"` — ou `[\"A\",\"B\",\"C\"].includes(conceito)`.","tests":[{"msg":"conceito deve ser \"B\" para a nota 7.5","code":"conceito === \"B\" "},{"msg":"Use if / else if / else para o conceito","code":"/else\\s+if\\s*\\(/.test(__code)"},{"msg":"valida deve ser true (7.5 está entre 0 e 10)","code":"valida === true"},{"msg":"Use uma condição de faixa com &&","code":"/nota\\s*>=\\s*0\\s*&&/.test(__code)"},{"msg":"situacao deve ser \"Aprovado\"","code":"situacao === \"Aprovado\" "}]}]},{"id":"funcoes","title":"Funções","icon":"🧩","lessons":[{"id":"m3l1","title":"Declarando e chamando funções","minutes":7,"theory":"\n## Blocos de código com nome\n\nUma **função** agrupa instruções que você pode executar quantas vezes quiser, quando quiser. Sem funções, todo código vira uma receita repetida e difícil de manter.\n\n```js\nfunction saudacao() {\n  console.log(\"Olá, tudo bem?\");\n}\n\nsaudacao();  // Olá, tudo bem?\nsaudacao();  // Olá, tudo bem?\n```\n\nTrês partes:\n\n1. `function` — palavra-chave.\n2. `saudacao` — o nome (verbo, camelCase: `calcularTotal`, `mostrarMensagem`).\n3. `{ ... }` — o corpo, o que a função faz.\n\n**Declarar** é escrever a receita. **Chamar** (ou invocar) é usar a receita: `saudacao()`.\n\n## Por que isso importa\n\n```js\nfunction mostrarCabecalho() {\n  console.log(\"==============\");\n  console.log(\"  MEU SISTEMA\");\n  console.log(\"==============\");\n}\n\nmostrarCabecalho();\nmostrarCabecalho();\n```\n\nSe amanhã o cabeçalho mudar, você altera em **um** lugar.\n\n> [warn] Sem os parênteses, `saudacao` é só a função em si (um valor). `saudacao()` é a execução dela. Confundir os dois é um erro clássico.\n","task":"\n1. Declare uma função chamada `apresentar` que imprime `Olá! Eu estou aprendendo JavaScript`.\n2. Chame a função **duas vezes**.\n","starter":"// 1. declare a função apresentar\n\n\n// 2. chame a função duas vezes\n\n","solution":"function apresentar() {\n  console.log(\"Olá! Eu estou aprendendo JavaScript\");\n}\n\napresentar();\napresentar();\n","hint":"A chamada fica fora das chaves, no final: `apresentar();` duas vezes.","tests":[{"msg":"Crie uma função chamada apresentar","code":"typeof apresentar === \"function\" "},{"msg":"A função deve imprimir a mensagem pedida","code":"__normalize(__printed()).includes(\"olá! eu estou aprendendo javascript\")"},{"msg":"Chame a função duas vezes (a mensagem deve aparecer 2 vezes)","code":"__logs.filter(function(l){ return l.text.toLowerCase().includes(\"aprendendo javascript\"); }).length >= 2"}]},{"id":"m3l2","title":"Parâmetros e return","minutes":8,"theory":"\n## Entrada: parâmetros\n\nParâmetros são os \"ingredientes\" da função:\n\n```js\nfunction saudar(nome) {\n  console.log(\"Olá, \" + nome + \"!\");\n}\n\nsaudar(\"Ana\");   // Olá, Ana!\nsaudar(\"Bruno\"); // Olá, Bruno!\n```\n\nCom vários parâmetros, a ordem importa: `function somar(a, b)` — ao chamar `somar(2, 3)`, `a` recebe 2 e `b` recebe 3.\n\n## Saída: return\n\n`return` devolve um valor para quem chamou. Ele também **encerra** a função imediatamente.\n\n```js\nfunction somar(a, b) {\n  return a + b;\n}\n\nconst resultado = somar(2, 3);  // 5\nconsole.log(resultado * 10);    // 50\n```\n\nA diferença entre `console.log` e `return` é enorme:\n\n- `console.log` **mostra** o valor no console (para humanos).\n- `return` **entrega** o valor ao programa (para o código continuar usando).\n\n```js\nfunction semReturn(a, b) {\n  a + b;\n}\nconsole.log(semReturn(2, 3));  // undefined  ← não devolveu nada\n```\n\n> [tip] Uma função que só imprime não pode ser reaproveitada em cálculos. Prefira funções que **retornam** e imprima o resultado na chamada.\n","task":"\nCrie duas funções:\n\n1. `somar(a, b)` — **retorna** a soma dos dois números.\n2. `media(a, b, c)` — **retorna** a média aritmética dos três (some e divida por 3).\n\nDepois imprima `somar(2, 3)` e `media(10, 20, 30)`.\n","starter":"// 1. função somar\n\n\n// 2. função media\n\n\nconsole.log(somar(2, 3));\nconsole.log(media(10, 20, 30));\n","solution":"function somar(a, b) {\n  return a + b;\n}\n\nfunction media(a, b, c) {\n  return (a + b + c) / 3;\n}\n\nconsole.log(somar(2, 3));\nconsole.log(media(10, 20, 30));\n","hint":"Não esqueça dos parênteses na soma da média: `(a + b + c) / 3`. Sem eles, a divisão só valeria para o `c`.","tests":[{"msg":"somar deve retornar 5 para somar(2, 3)","code":"typeof somar === \"function\" && somar(2, 3) === 5"},{"msg":"somar deve funcionar com outros números também","code":"somar(10, -4) === 6 && somar(0, 0) === 0"},{"msg":"media deve retornar 20 para media(10, 20, 30)","code":"typeof media === \"function\" && media(10, 20, 30) === 20"},{"msg":"Use return (e não apenas imprimir)","code":"/return/.test(__code)"}]},{"id":"m3l3","title":"Parâmetros padrão e resto","minutes":8,"theory":"\n## Valor padrão\n\nSe o argumento não for passado, o parâmetro vale `undefined`. Você pode definir um padrão:\n\n```js\nfunction criarUsuario(nome, papel = \"aluno\") {\n  return `${nome} (${papel})`;\n}\n\nconsole.log(criarUsuario(\"Ana\"));            // Ana (aluno)\nconsole.log(criarUsuario(\"Bruno\", \"admin\")); // Bruno (admin)\n```\n\nO padrão só é usado quando o argumento é `undefined` — passar `null` **não** ativa o padrão.\n\n## Quantidade variável: rest (...)\n\nO operador rest junta todos os argumentos que sobrarem em um **array**:\n\n```js\nfunction somarTudo(...numeros) {\n  let total = 0;\n  for (const n of numeros) {\n    total += n;\n  }\n  return total;\n}\n\nconsole.log(somarTudo(1, 2, 3, 4)); // 10\n```\n\n`...numeros` precisa ser o **último** parâmetro. E note: `numeros` é um array de verdade, então você pode usar `.length`, `.map`, etc.\n\n## Argumentos de verdade: arguments\n\nToda função tradicional tem o objeto `arguments`, com todos os argumentos recebidos. É antigo; prefira `...rest`.\n","task":"\nCrie duas funções:\n\n1. `criarUsuario(nome, papel = \"aluno\")` — retorna `` `${nome} (${papel})` ``.\n2. `somarTudo(...numeros)` — retorna a soma de todos os números recebidos (use `for...of`).\n\nImprima `criarUsuario(\"Ana\")` e `somarTudo(1, 2, 3, 4)`.\n","starter":"// 1. criarUsuario com valor padrão\n\n\n// 2. somarTudo usando rest (...)\n\n\nconsole.log(criarUsuario(\"Ana\"));\nconsole.log(somarTudo(1, 2, 3, 4));\n","solution":"function criarUsuario(nome, papel = \"aluno\") {\n  return `${nome} (${papel})`;\n}\n\nfunction somarTudo(...numeros) {\n  let total = 0;\n  for (const n of numeros) {\n    total += n;\n  }\n  return total;\n}\n\nconsole.log(criarUsuario(\"Ana\"));\nconsole.log(somarTudo(1, 2, 3, 4));\n","hint":"O valor padrão vai na declaração: `function criarUsuario(nome, papel = \"aluno\")`. E `for (const n of numeros)` percorre o array criado pelo rest.","tests":[{"msg":"criarUsuario(\"Ana\") deve retornar \"Ana (aluno)\"","code":"typeof criarUsuario === \"function\" && criarUsuario(\"Ana\") === 'Ana (aluno)'"},{"msg":"criarUsuario deve aceitar o papel informado","code":"criarUsuario(\"Bruno\", \"admin\") === 'Bruno (admin)'"},{"msg":"somarTudo(1, 2, 3, 4) deve retornar 10","code":"typeof somarTudo === \"function\" && somarTudo(1, 2, 3, 4) === 10"},{"msg":"somarTudo deve funcionar com qualquer quantidade de números","code":"somarTudo(5) === 5 && somarTudo() === 0 && somarTudo(1,1,1,1,1,1) === 6"},{"msg":"Use o operador rest (...) na função somarTudo","code":"/\\.\\.\\.\\s*\\w+/.test(__code)"}]},{"id":"m3l4","title":"Arrow functions","minutes":8,"theory":"\n## A forma curta\n\nArrow functions (funções seta) são uma sintaxe mais curta, criada no ES6:\n\n```js\n// função tradicional\nfunction dobro(n) {\n  return n * 2;\n}\n\n// arrow function\nconst dobro = (n) => {\n  return n * 2;\n};\n\n// arrow com corpo de expressão (return implícito)\nconst dobro = (n) => n * 2;\n```\n\nQuando a função tem **uma só expressão**, as chaves e o `return` são opcionais — o valor da expressão é devolvido automaticamente.\n\n```js\nconst somar = (a, b) => a + b;\nconst quadrado = n => n ** 2;        // um parâmetro dispensa parênteses\nconst aleatorio = () => Math.random(); // nenhum parâmetro: parênteses vazios\nconst criarObjeto = (n) => ({ nome: n }); // objeto precisa de parênteses\n```\n\nAs arrow functions aparecem em todo código moderno, principalmente como **callbacks**:\n\n```js\nconst numeros = [1, 2, 3];\nconst dobrados = numeros.map((n) => n * 2); // [2, 4, 6]\n```\n\n> [warn] Arrow functions **não têm** seu próprio `this` — elas herdam o `this` de onde foram escritas. Em métodos de objeto, use função tradicional.\n","task":"\nEscreva as três como **arrow functions** (usando `=>`), com return implícito quando possível:\n\n- `dobro(n)` — retorna `n * 2`.\n- `somar(a, b)` — retorna a soma.\n- `ehPar(n)` — retorna `true` se `n` for par (dica: `n % 2 === 0`).\n\nImprima `dobro(4)`, `somar(2, 3)` e `ehPar(7)`.\n","starter":"// 1. const dobro = ...\n\n\n// 2. const somar = ...\n\n\n// 3. const ehPar = ...\n\n\nconsole.log(dobro(4), somar(2, 3), ehPar(7));\n","solution":"const dobro = (n) => n * 2;\nconst somar = (a, b) => a + b;\nconst ehPar = (n) => n % 2 === 0;\n\nconsole.log(dobro(4), somar(2, 3), ehPar(7));\n","hint":"Sem chaves não precisa de `return`: `const dobro = (n) => n * 2;`. Mas atenção: `const ehPar = (n) => { n % 2 === 0 }` com chaves retornaria `undefined`.","tests":[{"msg":"dobro(4) deve ser 8","code":"typeof dobro === \"function\" && dobro(4) === 8"},{"msg":"somar(2, 3) deve ser 5","code":"typeof somar === \"function\" && somar(2, 3) === 5"},{"msg":"ehPar(7) deve ser false e ehPar(8) deve ser true","code":"typeof ehPar === \"function\" && ehPar(7) === false && ehPar(8) === true"},{"msg":"Use arrow functions (=>)","code":"/=>/.test(__code)"}]},{"id":"m3l5","title":"Escopo e closures","minutes":9,"theory":"\n## Onde cada variável existe\n\nO **escopo** define onde uma variável pode ser acessada:\n\n```js\nconst global = \"visível em todo lugar\";\n\nfunction exemplo() {\n  const interna = \"só existe aqui dentro\";\n  console.log(global);  // ok\n  console.log(interna); // ok\n}\n\nexemplo();\nconsole.log(interna); // ReferenceError: interna is not defined\n```\n\nVariáveis criadas com `let`/`const` dentro de `{ }` vivem só naquele bloco:\n\n```js\nif (true) {\n  const dentro = 1;\n}\nconsole.log(dentro); // ReferenceError\n```\n\n## Closure: a memória da função\n\nUma função \"lembra\" do escopo onde nasceu, mesmo depois de ele terminar. Isso é uma **closure**:\n\n```js\nfunction criarContador() {\n  let contagem = 0;         // variável privada\n\n  return function () {\n    contagem++;\n    return contagem;\n  };\n}\n\nconst contar = criarContador();\nconsole.log(contar()); // 1\nconsole.log(contar()); // 2\nconsole.log(contar()); // 3\n```\n\n`contagem` não existe fora de `criarContador` — ninguém pode estragá-la. É a base de encapsulamento em JavaScript e o que permite coisas como estado privado, memoização e módulos.\n\n> [tip] Pensou \"essa variável não deveria sumir quando a função termina?\" — deveria, mas a closure a mantém viva porque a função interna ainda pode precisar dela.\n","task":"\nCrie a função `criarContador`, que:\n\n1. Cria uma variável `contagem` começando em 0.\n2. Retorna uma função que **incrementa** `contagem` e a retorna.\n\nDepois: `const contar = criarContador();` e chame três vezes, imprimindo cada resultado (1, 2, 3).\n\nBônus: crie `outro = criarContador()` e mostre que ele começa do zero — cada contador tem sua própria `contagem`.\n","starter":"function criarContador() {\n  // seu código aqui\n}\n\nconst contar = criarContador();\nconsole.log(contar());\nconsole.log(contar());\nconsole.log(contar());\n","solution":"function criarContador() {\n  let contagem = 0;\n\n  return function () {\n    contagem++;\n    return contagem;\n  };\n}\n\nconst contar = criarContador();\nconsole.log(contar());\nconsole.log(contar());\nconsole.log(contar());\n\nconst outro = criarContador();\nconsole.log(outro()); // 1 — independente\n","hint":"A variável `let contagem = 0` precisa ficar **dentro** de `criarContador`, mas **fora** da função retornada. Assim cada contador criado tem a sua.","tests":[{"msg":"Crie a função criarContador","code":"typeof criarContador === \"function\" "},{"msg":"O contador deve retornar 1, 2 e 3 nas chamadas seguidas","code":"(function(){ const c = criarContador(); return c() === 1 && c() === 2 && c() === 3; })()"},{"msg":"Cada contador criado deve ser independente","code":"(function(){ const a = criarContador(); a(); const b = criarContador(); return b() === 1; })()"},{"msg":"A variável de contagem deve ser privada (use variável dentro da função)","code":"/let\\s+contagem|let\\s+\\w+\\s*=\\s*0/.test(__code)"}]},{"id":"m3l6","title":"Funções como valores e callbacks","minutes":8,"theory":"\n## Funções são valores\n\nEm JavaScript, função é um valor como número ou texto: pode ser guardada em variável, passada como argumento e devolvida por outra função.\n\n```js\nfunction gritar(texto) {\n  return texto.toUpperCase() + \"!\";\n}\n\nfunction sussurrar(texto) {\n  return texto.toLowerCase() + \"...\";\n}\n\nfunction falar(texto, estilo) {\n  console.log(estilo(texto));   // chama a função recebida\n}\n\nfalar(\"Olá\", gritar);      // OLÁ!\nfalar(\"Olá\", sussurrar);   // olá...\n```\n\nUma função passada para outra é chamada de **callback** (\"chame de volta\"). Quem recebe decide *quando* chamar.\n\n## Callbacks no dia a dia\n\n```js\nconst numeros = [1, 2, 3, 4];\n\nnumeros.forEach((n) => console.log(n));\nconst pares = numeros.filter((n) => n % 2 === 0);\nsetTimeout(() => console.log(\"depois de 1s\"), 1000);\n```\n\nNote: passamos `gritar` (a função), **não** `gritar()` (o resultado da chamada).\n\n> [warn] `falar(\"Olá\", gritar())` executaria `gritar` imediatamente e passaria o resultado. Sem parênteses!\n","task":"\nCrie:\n\n1. Duas funções: `gritar(texto)` → texto em maiúsculas com `!` no fim; `sussurrar(texto)` → texto em minúsculas com `...` no fim.\n2. `falar(texto, estilo)` — recebe um texto e uma **função**, imprime `estilo(texto)`.\n3. Chame `falar(\"Olá\", gritar)` e `falar(\"Olá\", sussurrar)`.\n","starter":"// 1. as duas funções de estilo\nfunction gritar(texto) {\n}\n\nfunction sussurrar(texto) {\n}\n\n// 2. falar(texto, estilo)\n\n\n// 3. as duas chamadas\n\n","solution":"function gritar(texto) {\n  return texto.toUpperCase() + \"!\";\n}\n\nfunction sussurrar(texto) {\n  return texto.toLowerCase() + \"...\";\n}\n\nfunction falar(texto, estilo) {\n  console.log(estilo(texto));\n}\n\nfalar(\"Olá\", gritar);\nfalar(\"Olá\", sussurrar);\n","hint":"Dentro de `falar`, chame o parâmetro como função: `estilo(texto)`. Na chamada, passe a função sem parênteses: `falar(\"Olá\", gritar)`.","tests":[{"msg":"gritar(\"oi\") deve retornar \"OI!\"","code":"typeof gritar === \"function\" && gritar(\"oi\") === \"OI!\" "},{"msg":"sussurrar(\"OI\") deve retornar \"oi...\"","code":"typeof sussurrar === \"function\" && sussurrar(\"OI\") === \"oi...\" "},{"msg":"falar deve chamar a função recebida e imprimir o resultado","code":"(function(){ const antes = __logs.length; falar(\"teste\", gritar); return __logs.length > antes && __logs[__logs.length-1].text === \"TESTE!\"; })()"},{"msg":"Chame falar com as duas funções diferentes","code":"__printed().includes(\"OLÁ!\") && __printed().toLowerCase().includes(\"olá...\")"}]}]},{"id":"arrays","title":"Arrays","icon":"📚","lessons":[{"id":"m4l1","title":"Criando e acessando arrays","minutes":7,"theory":"\n## Listas\n\nUm **array** é uma lista ordenada de valores. Em JavaScript ele é escrito entre colchetes:\n\n```js\nconst frutas = [\"maçã\", \"banana\", \"uva\"];\nconst numeros = [10, 20, 30, 40];\nconst misturado = [\"Ana\", 25, true];   // tipos diferentes podem conviver\nconst vazio = [];\n```\n\nCada posição tem um **índice**, que começa em **zero**:\n\n```js\nconsole.log(frutas[0]);  // maçã\nconsole.log(frutas[1]);  // banana\nconsole.log(frutas[3]);  // undefined (não existe)\n```\n\n## Tamanho e último item\n\n```js\nconsole.log(frutas.length);                  // 3\nconsole.log(frutas[frutas.length - 1]);      // uva  ← última posição\n```\n\nO `.length` é atualizado automaticamente: ele sempre diz quantos itens o array tem. O último índice é `length - 1`, porque o primeiro é 0.\n\n## Alterando um item\n\n```js\nfrutas[1] = \"morango\";\nconsole.log(frutas); // [\"maçã\", \"morango\", \"uva\"]\n```\n\n> [warn] `const` impede trocar o array por outro, mas **não** impede alterar o conteúdo: `frutas[0] = \"pera\"` funciona. Use `Object.freeze()` se quiser bloquear de verdade.\n","task":"\nCrie um array chamado `cores` com **três cores** (textos) à sua escolha, e depois:\n\n- `primeira` — a primeira cor (índice 0).\n- `ultima` — a última cor, usando `cores.length - 1` (não escreva o número na mão).\n- `quantidade` — quantos itens o array tem.\n\nImprima as três variáveis.\n","starter":"// 1. crie o array cores\n\n\n// 2. primeira, ultima e quantidade\n\n\nconsole.log(primeira, ultima, quantidade);\n","solution":"const cores = [\"azul\", \"verde\", \"vermelho\"];\n\nconst primeira = cores[0];\nconst ultima = cores[cores.length - 1];\nconst quantidade = cores.length;\n\nconsole.log(primeira, ultima, quantidade);\n","hint":"A última posição é `cores[cores.length - 1]`. Escrever `cores[-1]` não funciona em JavaScript (devolve `undefined`).","tests":[{"msg":"Crie um array `cores` com 3 itens","code":"Array.isArray(cores) && cores.length === 3"},{"msg":"primeira deve ser o primeiro item do array","code":"primeira === cores[0]"},{"msg":"ultima deve ser o último item (use length - 1)","code":"ultima === cores[2] && /length\\s*-\\s*1/.test(__code)"},{"msg":"quantidade deve ser 3","code":"quantidade === 3"}]},{"id":"m4l2","title":"Adicionando e removendo itens","minutes":8,"theory":"\n## No fim da lista\n\n```js\nconst fila = [\"Ana\", \"Bruno\"];\n\nfila.push(\"Carla\");     // adiciona no fim\nconsole.log(fila);      // [\"Ana\", \"Bruno\", \"Carla\"]\n\nconst ultimo = fila.pop();   // remove e devolve o último\nconsole.log(ultimo);         // Carla\nconsole.log(fila);           // [\"Ana\", \"Bruno\"]\n```\n\n## No começo da lista\n\n```js\nfila.unshift(\"Davi\");   // adiciona no início → [\"Davi\", \"Ana\", \"Bruno\"]\nconst primeiro = fila.shift();  // remove e devolve o primeiro → \"Davi\"\n```\n\n## Resumo\n\n| Método | Onde age | O que devolve |\n|---|---|---|\n| `push(item)` | fim | novo `length` |\n| `pop()` | fim | o item removido |\n| `unshift(item)` | início | novo `length` |\n| `shift()` | início | o item removido |\n\nTodos esses métodos **alteram** o array original (são mutáveis) e são rápidos no fim, mas `shift`/`unshift` precisam reindexar tudo — em listas gigantes, prefira `push`/`pop`.\n\n> [tip] `push` e `unshift` aceitam vários itens: `fila.push(\"Carla\", \"Davi\")`.\n","task":"\nVocê tem a fila de atendimento:\n\n```js\nconst fila = [\"Ana\", \"Bruno\"];\n```\n\nFaça, nesta ordem:\n\n1. Adicione `\"Carla\"` no **fim**.\n2. Remova a primeira pessoa e guarde na variável `atendido`.\n3. Adicione `\"Davi\"` no **início**.\n4. Guarde em `restantes` quantas pessoas sobraram.\n\nImprima `atendido`, `restantes` e `fila`.\n","starter":"const fila = [\"Ana\", \"Bruno\"];\n\n// 1. adicione Carla no fim\n\n\n// 2. remova a primeira pessoa -> atendido\n\n\n// 3. adicione Davi no início\n\n\n// 4. quantas sobraram\n\n\nconsole.log(atendido, restantes, fila);\n","solution":"const fila = [\"Ana\", \"Bruno\"];\n\nfila.push(\"Carla\");\nconst atendido = fila.shift();\nfila.unshift(\"Davi\");\nconst restantes = fila.length;\n\nconsole.log(atendido, restantes, fila);\n","hint":"`shift()` remove do início e devolve quem saiu — perfeito para \"atender a próxima pessoa\". Depois de tudo, a fila deve ser `[\"Davi\", \"Bruno\", \"Carla\"]`.","tests":[{"msg":"atendido deve ser \"Ana\" (a primeira da fila)","code":"atendido === \"Ana\" "},{"msg":"A fila final deve ser Davi, Bruno, Carla","code":"JSON.stringify(fila) === JSON.stringify([\"Davi\",\"Bruno\",\"Carla\"])"},{"msg":"restantes deve ser 3","code":"restantes === 3"},{"msg":"Use push, shift e unshift","code":"/push/.test(__code) && /shift\\(/.test(__code) && /unshift/.test(__code)"}]},{"id":"m4l3","title":"Buscando dentro de arrays","minutes":8,"theory":"\n## Onde está? Existe?\n\n```js\nconst nums = [10, 20, 30, 40, 50];\n\nnums.indexOf(30);     // 2    (posição)\nnums.indexOf(99);     // -1   (não encontrado)\nnums.includes(40);    // true\nnums.includes(99);    // false\n```\n\n`indexOf` devolve a posição ou `-1`. `includes` devolve um booleano — muito mais legível quando você só quer saber se existe.\n\n## Encontrando por uma condição\n\n```js\nconst pessoas = [\n  { nome: \"Ana\", idade: 25 },\n  { nome: \"Bruno\", idade: 17 },\n  { nome: \"Carla\", idade: 32 },\n];\n\nconst primeiroAdulto = pessoas.find((p) => p.idade >= 18);\nconsole.log(primeiroAdulto.nome);  // Ana\n\nconst posicao = pessoas.findIndex((p) => p.idade < 18);\nconsole.log(posicao);              // 1\n```\n\n- `find` devolve o **primeiro item** que satisfaz a condição (ou `undefined`).\n- `findIndex` devolve a **posição** desse item (ou `-1`).\n\n## Fatiando sem estragar\n\n```js\nconst fatia = nums.slice(1, 3);   // [20, 30]  (do índice 1 até o 3, sem incluir o 3)\nconst fim = nums.slice(-2);       // [40, 50]  (últimos dois)\nnums.slice();                     // cópia completa\n```\n\n`slice` **não altera** o array original: devolve um pedaço novo.\n\n> [warn] Não confunda `slice` (fatia, não muda nada) com `splice` (cirurgia, altera o array). Essa é uma das pegadinhas mais comuns.\n","task":"\nVocê tem:\n\n```js\nconst nums = [10, 20, 30, 40, 50];\n```\n\nCrie:\n\n- `posicao` — o índice do valor 30 (use `indexOf`).\n- `temQuarenta` — booleano: o array inclui 40?\n- `primeiroMaiorQue25` — o primeiro número maior que 25 (use `find` com arrow function).\n- `fatia` — um novo array com os itens dos índices 1 e 2 (use `slice`).\n\nImprima tudo.\n","starter":"const nums = [10, 20, 30, 40, 50];\n\n// posicao, temQuarenta, primeiroMaiorQue25, fatia\n\n\nconsole.log(posicao, temQuarenta, primeiroMaiorQue25, fatia);\n","solution":"const nums = [10, 20, 30, 40, 50];\n\nconst posicao = nums.indexOf(30);\nconst temQuarenta = nums.includes(40);\nconst primeiroMaiorQue25 = nums.find((n) => n > 25);\nconst fatia = nums.slice(1, 3);\n\nconsole.log(posicao, temQuarenta, primeiroMaiorQue25, fatia);\n","hint":"`slice(1, 3)` pega os índices 1 e 2 — o segundo número é **exclusivo**.","tests":[{"msg":"posicao deve ser 2","code":"posicao === 2"},{"msg":"temQuarenta deve ser true","code":"temQuarenta === true"},{"msg":"primeiroMaiorQue25 deve ser 30","code":"primeiroMaiorQue25 === 30"},{"msg":"fatia deve ser [20, 30] e não pode alterar nums","code":"JSON.stringify(fatia) === JSON.stringify([20,30]) && nums.length === 5"},{"msg":"Use find com uma arrow function","code":"/\\.find\\s*\\(/.test(__code) && /=>/.test(__code)"}]},{"id":"m4l4","title":"Transformando: map e filter","minutes":9,"theory":"\n## map: transforme cada item\n\n`map` cria um **novo array** com o resultado da função aplicada a cada item:\n\n```js\nconst precos = [10, 20, 30];\n\nconst comDesconto = precos.map((p) => p * 0.9);\nconsole.log(comDesconto);  // [9, 18, 27]\n\nconsole.log(precos);       // [10, 20, 30]  ← o original não muda\n```\n\nMesma quantidade de itens, valores transformados.\n\n## filter: escolha alguns itens\n\n`filter` cria um **novo array** só com os itens que passam no teste (a função precisa devolver `true` ou `false`):\n\n```js\nconst caros = precos.filter((p) => p > 15);\nconsole.log(caros);  // [20, 30]\n```\n\n## Encadeando\n\nO poder está em combinar: `map` devolve array, `filter` devolve array, então você pode emendar um no outro.\n\n```js\nconst nomes = [\"ana\", \"bruno\", \"carla\"];\nconst resultado = nomes\n  .filter((n) => n.length > 3)\n  .map((n) => n.toUpperCase());\nconsole.log(resultado);  // [\"BRUNO\", \"CARLA\"]\n```\n\n> [tip] A função recebida pelo `map`/`filter` pode ter um segundo parâmetro: o índice. `precos.map((p, i) => `${i}: ${p}`)`.\n","task":"\nVocê tem:\n\n```js\nconst precos = [10, 20, 30, 40];\n```\n\nCrie:\n\n- `comDesconto` — cada preço com 10% de desconto (`p * 0.9`), usando `map`.\n- `caros` — só os preços acima de 15, usando `filter`.\n- `carosComDesconto` — os preços acima de 15, **já** com desconto (encadeie os dois).\n- `emReais` — cada preço formatado como `\"R$ 10\"` (template string no `map`).\n\nImprima tudo.\n","starter":"const precos = [10, 20, 30, 40];\n\n// crie as quatro variáveis\n\n\nconsole.log(comDesconto, caros, carosComDesconto, emReais);\n","solution":"const precos = [10, 20, 30, 40];\n\nconst comDesconto = precos.map((p) => p * 0.9);\nconst caros = precos.filter((p) => p > 15);\nconst carosComDesconto = precos.filter((p) => p > 15).map((p) => p * 0.9);\nconst emReais = precos.map((p) => `R$ ${p}`);\n\nconsole.log(comDesconto, caros, carosComDesconto, emReais);\n","hint":"Para o encadeamento: `precos.filter((p) => p > 15).map((p) => p * 0.9)` — o `filter` vem primeiro porque devolve o array filtrado.","tests":[{"msg":"comDesconto deve ser [9, 18, 27, 36]","code":"JSON.stringify(comDesconto) === JSON.stringify([9,18,27,36])"},{"msg":"caros deve ser [20, 30, 40]","code":"JSON.stringify(caros) === JSON.stringify([20,30,40])"},{"msg":"carosComDesconto deve ser [18, 27, 36]","code":"JSON.stringify(carosComDesconto) === JSON.stringify([18,27,36])"},{"msg":"emReais deve ser [\"R$ 10\", \"R$ 20\", \"R$ 30\", \"R$ 40\"]","code":"JSON.stringify(emReais) === JSON.stringify([\"R$ 10\",\"R$ 20\",\"R$ 30\",\"R$ 40\"])"},{"msg":"precos original deve continuar com 4 itens","code":"precos.length === 4 && precos[0] === 10"}]},{"id":"m4l5","title":"reduce e sort","minutes":9,"theory":"\n## reduce: resumindo um array em um valor\n\n`reduce` percorre o array acumulando um resultado. Ele recebe uma função com dois parâmetros: o **acumulador** e o item atual — e no final, o valor inicial do acumulador.\n\n```js\nconst nums = [5, 1, 4, 2];\n\nconst soma = nums.reduce((total, n) => total + n, 0);\nconsole.log(soma);  // 12\n```\n\nO `0` do final é o valor inicial. Sem ele, o primeiro item vira o acumulador.\n\n`reduce` também monta objetos — é assim que se conta ocorrências:\n\n```js\nconst frutas = [\"uva\", \"maçã\", \"uva\", \"pera\", \"uva\"];\nconst contagem = frutas.reduce((acc, f) => {\n  acc[f] = (acc[f] || 0) + 1;\n  return acc;\n}, {});\nconsole.log(contagem);  // { uva: 3, \"maçã\": 1, pera: 1 }\n```\n\n## sort\n\n`sort` **altera** o array e, por padrão, ordena como texto (o que dá errado com números!):\n\n```js\nconsole.log([10, 9, 100].sort());  // [10, 100, 9]  ← ordem alfabética\n\nconsole.log([10, 9, 100].sort((a, b) => a - b));  // [9, 10, 100] crescente\nconsole.log([10, 9, 100].sort((a, b) => b - a));  // [100, 10, 9] decrescente\n```\n\n> [warn] Como `sort` altera o array original, use `[...nums].sort(...)` para ordenar uma cópia.\n","task":"\nVocê tem `const nums = [5, 1, 4, 2];`.\n\nCrie:\n\n- `soma` — a soma de todos os números, com `reduce` e valor inicial 0.\n- `crescente` — uma **cópia** ordenada do menor para o maior.\n- `decrescente` — uma **cópia** ordenada do maior para o menor.\n- `maior` — o maior número (dica: `reduce` comparando, ou `Math.max(...nums)`).\n\nDepois de tudo, `nums` deve continuar na ordem original.\n","starter":"const nums = [5, 1, 4, 2];\n\n// soma, crescente, decrescente, maior\n\n\nconsole.log(soma, crescente, decrescente, maior);\nconsole.log(\"original:\", nums);\n","solution":"const nums = [5, 1, 4, 2];\n\nconst soma = nums.reduce((total, n) => total + n, 0);\nconst crescente = [...nums].sort((a, b) => a - b);\nconst decrescente = [...nums].sort((a, b) => b - a);\nconst maior = nums.reduce((max, n) => (n > max ? n : max), nums[0]);\n\ncon
